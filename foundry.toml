[profile.default]
src = "contracts/src"
test = "test"
script = "script"
out = "out"
libs = ["contracts/lib"]
solc = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=contracts/lib/v4-core/",
    "@uniswap/v4-periphery/=contracts/lib/v4-periphery/",
    "@uniswap/v4-hooks-public/=contracts/lib/v4-hooks-public/",
    "forge-std/=/Users/stacc/nft-range/lib/forge-std/src/",
    "v4-core/=contracts/lib/v4-core/src/",
    "v4-periphery/=contracts/lib/v4-periphery/src/",
    "permit2/=contracts/lib/v4-periphery/lib/permit2/",
    "solmate/=contracts/lib/v4-core/lib/solmate/",
    "v4-hooks-public/=contracts/lib/v4-hooks-public/src/",
]

fs_permissions = [
    { access = "read-write", path = "./app/src/deployments" },
    { access = "read", path = "./test/fixtures" },
]
